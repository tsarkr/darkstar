[package]
name = "darkstar"
version = "0.2.1"
edition = "2021"
description = "Professional OWL 2 RL Ontology Editor & Inference Engine"
authors = ["Ontology Team"]
repository = "https://github.com/user/darkstar"

[dependencies]
image = "0.25"
sophia = { version = "0.8", features = ["xml"] }
rayon = "1.10"
tokio = { version = "1.36", features = ["full"] }
uuid = { version = "1.8", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.29"
rfd = "0.14"
egui_dock = "0.14"
directories = "5.0"
egui_extras = { version = "0.29.1", features = ["image"] }
libloading = "0.9.0"
once_cell = "1.19"
# SPARQL 1.1 query parsing + evaluation over Darkstar's graphs (Oxigraph components)
spargebra = "0.4.7"
spareval = "0.2.7"
oxrdf = "0.3.4"

[package.metadata.packager]
name = "Darkstar"
identifier = "com.darkstar.ontology.editor"
version = "0.2.0"
authors = ["Darkstar Team"]
description = "Professional OWL 2 RL Ontology Editor"
copyright = "Copyright © 2026 Darkstar Team"
category = "DeveloperTool"
icons = ["assets/icon.png", "assets/icon.icns"]
formats = ["dmg", "app", "wix", "nsis"]

[package.metadata.packager.macos]
minimum_system_version = "11.0"

[package.metadata.packager.windows]
